# Publishes main to GitHub Pages WITHOUT waiting for the tests.
#
# Tim, 2026-10-06: "forget the test. push now." The gated route (tests.yml)
# takes about eleven minutes because tr-test does; this one takes about one.
# It never runs by itself — only when started by hand:
#
#   gh workflow run deploy-now.yml -R TimothyHadfield/fantasy-football
#
# The tests still run on every push in tests.yml and still publish when green,
# so a site put up by this route is replaced by the tested one a few minutes
# later (the same commit), or stays if the tests fail — check them.

name: deploy now

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The same group as the gated deploy job, so two deploys never overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
