# Runs every suite in tests/ (tests/run-all.mjs) on each push and pull request.
#
# The suites need no network: every ESPN read is stubbed, and fetch in the
# page harnesses throws on any real request. Node 22 because linkedom's
# dependencies require Node >= 20.19.

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install
        working-directory: tests
        run: npm ci || npm install

      - name: Test
        working-directory: tests
        run: npm test
