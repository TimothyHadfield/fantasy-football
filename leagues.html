<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leagues &middot; Fantasy Football</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Fantasy">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f1115">
<script src="js/site-status.js" defer></script>
<link rel="stylesheet" href="css/app.css">
<style>
/* Page-local styles. Everything else comes from css/app.css.
 *
 * THE MAIN MENU (Tim, 2026-10-10). It is outside the sections, so the header
 * holds the brand alone — no nav, no connection bar.
 *
 * THE PAGE NEVER SCROLLS: the body is exactly the screen, a column of header,
 * content and the "Site updated" line, and the LIST is the one part that gives
 * way — a long list scrolls inside itself and the Add field stays in view
 * under it. */
html, body { height: 100%; }
body {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: 12px;
}
header.site { flex: none; margin-bottom: 20px; }
/* The account, in the header's far corner: the connection bar's own "Sign in
 * with Google", or who is signed in and "Sign out". It ALWAYS takes a button's
 * height (min-height: 44px on a phone, the site's thumb target), so nothing
 * moves when sign-in answers a beat after the page; the negative margins keep
 * a laptop's header as tall as it was without it. A long address is cut short
 * rather than pushing the brand. */
header.site .wrap { flex-wrap: nowrap; }
header.site .brand { flex: none; }
.lg-account {
  margin: -6px 0 -6px auto;
  min-width: 0;
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.lg-signed { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--dim); }
.lg-account button { flex: none; padding: 6px 10px; font-size: 13px; }
main.wrap { flex: 0 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; }
/* The header and the page take the section pages' own width (.wrap.wide), so
 * the brand stands exactly where it stood on the page you came from; the list
 * itself stops at a readable width instead of stretching Remove to the far
 * edge of a wide screen. */
.lg { flex: 0 1 auto; min-height: 0; max-width: 1180px; display: flex; flex-direction: column; }
.lg h1 { flex: none; margin-bottom: 10px; }
footer.site-stamp { flex: none; width: 100%; max-width: 1600px; margin-top: 10px; }

/* The list. Rows are divided by a line, not boxed. On a laptop a league is one
 * line: who | seasons | Remove. */
.lg-list {
  flex: 0 1 auto;
  min-height: 0;
  overflow-y: auto;
  list-style: none;
  margin: 0;
  padding: 0;
}
.lg-row {
  display: grid;
  grid-template-columns: minmax(0, 340px) minmax(0, 1fr) auto;
  grid-template-areas: "who seasons remove";
  align-items: center;
  column-gap: 20px;
  padding: 11px 0;
}
.lg-row + .lg-row { border-top: 1px solid var(--line); }
.lg-who { grid-area: who; min-width: 0; }
.lg-name, .lg-meta { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg-name { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
.lg-meta { font-size: 13px; color: var(--dim); min-height: 19.5px; }

/* The seasons, and the Remove confirm step, share ONE cell and both always
 * take their room in it — whichever is not in use is only invisible. So asking
 * to remove a league changes no size anywhere on the page. */
.lg-seasons, .lg-confirm { grid-area: seasons; min-width: 0; }
.lg-seasons { display: flex; flex-wrap: wrap; gap: 6px; }
.lg-season { min-width: 62px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
/* The league and season that is open: the site's own "this one" fill. */
.lg-season.on {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}
.lg-season.on:hover:not(:disabled) { background: var(--accent-hi); }

.lg-remove {
  grid-area: remove;
  background: transparent;
  border-color: transparent;
  color: var(--dim);
  font-size: 12.5px;
  padding: 6px 8px;
}
.lg-remove:hover:not(:disabled) { color: var(--text); }

.lg-confirm {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  align-self: center;
  visibility: hidden;
}
.lg-keep { font-size: 13px; color: var(--dim); margin-right: 4px; }
.lg-confirm button { padding: 6px 12px; }
.lg-yes { color: var(--err); }
.lg-row.confirming .lg-confirm { visibility: visible; }
.lg-row.confirming .lg-seasons,
.lg-row.confirming .lg-remove { visibility: hidden; }

.lg-empty { flex: none; color: var(--dim); font-size: 14px; margin: 0; }

/* Add a league. The message line keeps its height when it is empty, so a
 * reason arriving moves nothing. */
.lg-add { flex: none; margin-top: 14px; }
.lg-list:not([hidden]) ~ .lg-add { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 0; }
.lg-add-row { display: flex; gap: 8px; max-width: 420px; }
.lg-add-row input { flex: 1 1 auto; min-width: 0; }
.lg-add-row button { flex: none; }
.lg-msg { min-height: 20px; margin: 6px 0 0; font-size: 13px; line-height: 20px; color: var(--dim); }
.lg-msg.bad { color: var(--err); }

/* ------------------------------------------------------------------- phone
 * One column: the name with Remove beside it, then the seasons five to a line
 * (nine seasons are two lines), each a full thumb target. */
@media (max-width: 760px) {
  body { padding-bottom: 8px; }
  header.site { margin-bottom: 14px; }
  .lg-account { min-height: 44px; }
  .lg-row {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "who remove" "seasons seasons";
    row-gap: 6px;
    column-gap: 8px;
    padding: 9px 0;
  }
  .lg-name { font-size: 17px; }
  .lg-seasons { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .lg-season { min-width: 0; padding-left: 4px; padding-right: 4px; }
  .lg-confirm { align-self: start; }
  .lg-add-row { max-width: none; }
}
</style>
</head>
<body>

<header class="site">
  <div class="wrap wide">
    <span class="brand">Fantasy Football</span>
    <div id="lgAccount" class="lg-account"></div>
  </div>
</header>

<main class="wrap wide">
  <section class="lg">
    <h1>Leagues</h1>

    <ul id="lgList" class="lg-list" hidden></ul>
    <p id="lgEmpty" class="lg-empty" hidden>No leagues yet.</p>

    <form id="lgAdd" class="lg-add" novalidate>
      <label for="lgId">Add a league</label>
      <div class="lg-add-row">
        <input id="lgId" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="League ID or ESPN link">
        <button type="submit" id="lgAddBtn" class="primary">Add</button>
      </div>
      <p id="lgMsg" class="lg-msg" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>

<script type="module" src="js/leagues-page.js"></script>
</body>
</html>
