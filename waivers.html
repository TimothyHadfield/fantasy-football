<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players &middot; Fantasy Football</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="css/app.css">
<style>
/* Page-local styles. Everything else comes from css/app.css. */

.seg-sm button { padding: 6px 12px; font-size: 13px; }

/* The count of players behind each position button. It is the second thing you
   read on the button, never the first, so it is quieter than the label. */
.seg-count {
  margin-left: 6px;
  font-weight: 500;
  opacity: 0.72;
  font-variant-numeric: tabular-nums;
}

/* A control needs to say what it is; these tables have two segmented controls
   side by side and they answer completely different questions. */
.ctl { display: flex; flex-direction: column; gap: 6px; }
.ctl-label {
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--dim);
  font-weight: 600;
}
/* What the choice above costs, next to the choice rather than in the note
   several paragraphs down. */
.cost { color: var(--dim); font-size: 12.5px; align-self: flex-end; padding-bottom: 7px; }

/* The mean of the weeks shown is the one column that orders the table into
   something useful, so it carries a little more weight than a single week, and
   a rule brackets it off from the run of weeks to its right. */
td.avg { font-weight: 650; color: var(--text); }

/* A bye is ESPN's 0.00, and printing "0.0" would read as a projection of
   nothing rather than as no game at all. */
td.bye {
  color: var(--warn);
  font-size: 11.5px;
  letter-spacing: 0.04em;
}
/* A week that has not come back from ESPN yet: present, but deliberately not
   readable as a value. */
td.wait { color: var(--line); }

/* A week worth actually starting the player for, by the per-position bar in
   STARTABLE. Colour AND weight, never colour alone: this is the one cue on the
   page that says "look here", and roughly one man in twelve cannot separate
   the green from the grey around it. */
td.hot {
  color: var(--accent);
  font-weight: 650;
}
/* The word "green" in the note, shown in the colour it is describing. */
.hot-key { color: var(--accent); font-weight: 650; }

/* A week where this free agent out-projects your own worst man at his position
   — the "Your RB5" row he is sorted in among.

   A SHADE rather than a text colour, because td.hot above has already spent the
   text colour on a different question and the two answers are independent: a
   cell can be worth starting, worth claiming, both, or neither. Both cues are
   green because both say "look here"; they are told apart by treatment, which
   is also what keeps them legible to anyone who cannot separate the hues.

   Written twice, because the zebra band and the row hover each paint their own
   background and this has to survive both. */
#waiverTable tbody td.beats,
#waiverTable tbody tr:hover td.beats { background: #16311f; }
/* Over the shade, the startable green needs to stay clearly the brighter cue. */
#waiverTable tbody td.hot.beats { color: var(--accent-hi); }
/* The phrase in the note, shown in the treatment it is describing. */
.beats-key {
  background: #16311f;
  border-radius: var(--r-1);
  padding: 1px 6px;
  color: var(--text);
  font-weight: 600;
}

/* YOUR OWN WORST PLAYER AT A POSITION, sitting in the same list as the men who
   could replace him. It has to be unmistakably not-a-free-agent: this is the
   one you would drop, not one you can add.

   An edge and a bracketing rule rather than a filled background. The zebra
   striping owns the backgrounds here — td.name is sticky and carries its own
   opaque one — so a fill would have to be stated twice and would still lose the
   banding. A rule survives both. --good, not --accent: green already means
   "worth starting" two rules up, and it is deliberately not that. */
tbody tr.mine td {
  border-top: 1px solid var(--good);
  border-bottom: 1px solid var(--good);
}
/* The frozen column's own drop shadow has to survive alongside the inset edge,
   or the row loses the cue that more columns run off to the right. */
tbody tr.mine td.name {
  box-shadow: inset 3px 0 0 var(--good), 6px 0 7px -7px rgba(0, 0, 0, 0.85);
  padding-left: 12px;
}
/* "Your QB3". The label is the identity on these rows, so it leads the cell
   rather than trailing the name the way an injury tag does. */
.mine-tag {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 1px 5px;
  margin-right: 2px;
  border-radius: var(--r-pill);
  border: 1px solid var(--good);
  color: var(--good);
}
/* "Your …" in the note, shown in the colour the rows are marked with. */
.mine-key { color: var(--good); font-weight: 650; }

/* Availability, as a tag beside the name. OUT and IR also dim the whole row:
   a player who cannot play is still worth listing, but never worth reading
   first. */
.tag {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 1px 5px;
  margin-left: 7px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  color: var(--dim);
}
.tag.bad { color: var(--err); border-color: #5a2424; }
.tag.warn { color: var(--warn); border-color: #5a4718; }
tbody tr.unavailable td { color: var(--dim); }
tbody tr.unavailable td.name { font-weight: 500; }

.empty-row td { text-align: center; color: var(--dim); padding: 24px 12px; }

/* THE TAKEN TABLE carries no colour at all — no td.hot, no td.beats — because
   both of those cues argue for a claim and nobody here can be claimed. The only
   thing it needs of its own is the manager's name, which is free text and long
   enough to push the week columns off the screen if it is left to size itself. */
#takenTable td.owner {
  color: var(--dim);
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* "QB3" — the position and where he ranks on his own manager's roster. The rank
   is ours, so it is set apart from the position rather than run into it. */
#takenTable td.pos .rank { color: var(--dim); font-variant-numeric: tabular-nums; }

/* A headline number means nothing without the player it belongs to, and the
   player is context rather than the number itself. */
#waiverStats .stat .who {
  font-size: 12.5px;
  color: var(--dim);
  margin-top: 1px;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* A PLAYER REFERENCE. Every page on the site links to a man's row here the same
   way, and so does this page. Restrained on purpose: there are hundreds of them
   in these two tables, and painting each one blue would turn the wire into a
   wall of links and lose the numbers, which are the point. The affordance shows
   up on hover and on keyboard focus, which is when it is actually wanted. */
a.pref { color: inherit; text-decoration: none; cursor: pointer; }
a.pref:hover { text-decoration: underline; text-underline-offset: 2px; color: var(--accent); }
a.pref:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
  border-radius: var(--r-1);
}

/* THE MAN A LINK LANDED ON. The row keeps its own colours — it is still a wire
   row or a taken row and still has to read as one — so this is an edge and a
   tint rather than a repaint, the same treatment the comparison rows use for
   the same reason. Written twice so it survives the zebra band and the hover,
   both of which paint their own background. */
tbody tr.spotlight td,
tbody tr.spotlight:hover td { background: #16311f; }
tbody tr.spotlight td.name {
  background: #16311f;
  box-shadow: inset 3px 0 0 var(--accent), 6px 0 7px -7px rgba(0, 0, 0, 0.85);
  padding-left: 12px;
}

/* The strip that says who we jumped to. It sits above the panels rather than
   inside one, because the jump moved settings in BOTH of them and a note in
   either would be describing only half of what happened. */
.jump {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 14px;
  padding: 9px 14px;
  border: 1px solid var(--accent);
  border-radius: var(--r-2);
  background: #16311f;
  font-size: 13.5px;
}
.jump button { padding: 4px 12px; font-size: 12.5px; margin-left: auto; }
</style>
</head>
<body>

<header class="site">
  <div class="wrap wide">
    <span class="brand">Fantasy Football</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="stats.html">Stats</a>
      <a href="analysis.html">Analysis</a>
      <a href="schedule.html">Schedule</a>
      <a href="waivers.html" class="active">Players</a>
      <a href="trade.html">Trade</a>
      <a href="draft.html">Draft</a>
    </nav>
  </div>
</header>



<div class="wrap wide">

  <div id="connBar"></div>


  <!-- Filled by the module when a ?player= link lands. Hidden otherwise. -->
  <div id="jumpNote" class="jump hidden"></div>

  <h1>Players <span id="modeBadge" class="badge demo">Demo</span></h1>
  <p class="sub" id="pageSub">Showing a generated sample waiver wire so you can see the layout with real-looking projections in it.</p>

  <section class="panel">
    <h2>Data source</h2>
    <div class="segmented" id="sourceToggle">
      <button type="button" data-src="demo" class="on">Demo data</button>
      <button type="button" data-src="live">My ESPN league</button>
    </div>
    <div id="sourceStatus" class="panel-note"></div>
  </section>

  <section class="panel">
    <h2>Available players</h2>

    <div class="row spread mb-12">
      <div class="ctl">
        <span class="ctl-label" id="posLabel">Position</span>
        <!-- FLEX sits after TE and before K because that is where a flex sits
             in a lineup, and because the three positions it spans are the three
             immediately to its left. It is a FILTER, not a position: it matches
             every RB, WR and TE at once and changes nothing about the players
             themselves. -->
        <div class="segmented seg-sm" id="posFilter" role="group" aria-labelledby="posLabel">
          <button type="button" data-pos="ALL" class="on">All<span class="seg-count"></span></button>
          <button type="button" data-pos="QB">QB<span class="seg-count"></span></button>
          <button type="button" data-pos="RB">RB<span class="seg-count"></span></button>
          <button type="button" data-pos="WR">WR<span class="seg-count"></span></button>
          <button type="button" data-pos="TE">TE<span class="seg-count"></span></button>
          <button type="button" data-pos="FLEX" title="Every running back, receiver and tight end at once — the men who could fill a flex spot. A filter only: each one keeps his own position.">FLEX<span class="seg-count"></span></button>
          <button type="button" data-pos="K">K<span class="seg-count"></span></button>
          <button type="button" data-pos="DST">DST<span class="seg-count"></span></button>
        </div>
      </div>

      <div class="ctl">
        <span class="ctl-label" id="spanLabel">Weeks to price</span>
        <div class="segmented seg-sm" id="spanFilter" role="group" aria-labelledby="spanLabel">
          <button type="button" data-span="3" class="on">Next 3</button>
          <button type="button" data-span="6">Next 6</button>
          <button type="button" data-span="all">Rest of season</button>
        </div>
      </div>

      <span class="cost" id="spanCost"></span>
    </div>

    <div class="stat-row" id="waiverStats"></div>

    <div class="table-scroll"><table id="waiverTable">
      <thead></thead>
      <tbody></tbody>
    </table></div>
    <p class="panel-note" id="waiverNote"></p>
  </section>

  <!-- The other half of the league: everyone who IS on a roster. The two panels
       are one table split by whether you could actually claim the man.

       Its OWN position filter, because filtering is free and sharing one meant
       narrowing this table was a scroll back up past a hundred free agents to a
       control in the other panel — which then dragged the wire along with it.
       The SAME span control, because that one is the request budget and both
       tables are priced over the same weeks: one choice, shown at both ends of
       a long page, never two choices that could disagree. -->
  <section class="panel">
    <h2>Taken players</h2>

    <div class="row spread mb-12">
      <div class="ctl">
        <span class="ctl-label" id="takenPosLabel">Position</span>
        <!-- The same FLEX button, on this table's own set. Its count is this
             table's — how many the league is holding — and it does not touch the
             rank beside a name: a man is still his manager's RB2, never a
             FLEX2. -->
        <div class="segmented seg-sm" id="takenPosFilter" role="group" aria-labelledby="takenPosLabel">
          <button type="button" data-pos="ALL" class="on">All<span class="seg-count"></span></button>
          <button type="button" data-pos="QB">QB<span class="seg-count"></span></button>
          <button type="button" data-pos="RB">RB<span class="seg-count"></span></button>
          <button type="button" data-pos="WR">WR<span class="seg-count"></span></button>
          <button type="button" data-pos="TE">TE<span class="seg-count"></span></button>
          <button type="button" data-pos="FLEX" title="Every running back, receiver and tight end the league is holding. A filter only: each one keeps his own position and his own rank on his manager’s squad.">FLEX<span class="seg-count"></span></button>
          <button type="button" data-pos="K">K<span class="seg-count"></span></button>
          <button type="button" data-pos="DST">DST<span class="seg-count"></span></button>
        </div>
      </div>

      <div class="ctl">
        <span class="ctl-label" id="takenSpanLabel">Weeks to price</span>
        <div class="segmented seg-sm" id="takenSpanFilter" role="group" aria-labelledby="takenSpanLabel">
          <button type="button" data-span="3" class="on">Next 3</button>
          <button type="button" data-span="6">Next 6</button>
          <button type="button" data-span="all">Rest of season</button>
        </div>
      </div>

      <span class="cost" id="takenSpanCost"></span>
    </div>

    <div class="stat-row" id="takenStats"></div>

    <div class="table-scroll"><table id="takenTable">
      <thead></thead>
      <tbody></tbody>
    </table></div>
    <p class="panel-note" id="takenNote"></p>
  </section>

</div>

<script type="module" src="js/waivers-page.js"></script>
<script type="module" src="js/connection.js"></script>
</body>
</html>
